<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG (Retrieval-Augmented Generation) 流程互動演示</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --secondary-color: #818cf8;
            --success-color: #4ade80;
            --node-bg: #1e293b;
            --node-border: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 2rem;
            z-index: 10;
        }

        h1 {
            margin: 0;
            background: linear-gradient(to right, var(--accent-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            font-weight: 800;
        }

        .subtitle {
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 10;
        }

        button {
            background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
            border: none;
            padding: 0.75rem 2rem;
            color: white;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.reset {
            background: #334155;
        }

        .info-panel {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--node-bg);
            border-radius: 0.5rem;
            border: 1px solid var(--node-border);
            max-width: 800px;
            width: 90%;
            min-height: 100px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .info-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .info-desc {
            line-height: 1.6;
            color: #cbd5e1;
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: 100%;
        }

        .node-rect {
            fill: var(--node-bg);
            stroke: var(--node-border);
            stroke-width: 2;
            rx: 10;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
            transition: all 0.3s ease;
        }

        .node-group:hover .node-rect {
            stroke: var(--accent-color);
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
        }

        .node-text {
            fill: var(--text-color);
            font-family: sans-serif;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
        }

        .node-icon {
            fill: var(--accent-color);
            pointer-events: none;
        }

        .connection-path {
            fill: none;
            stroke: #334155;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }

        .active-path {
            stroke: var(--accent-color);
            stroke-width: 3;
            stroke-dasharray: none;
            filter: drop-shadow(0 0 5px var(--accent-color));
        }

        .packet {
            fill: var(--success-color);
            filter: drop-shadow(0 0 8px var(--success-color));
            opacity: 0;
        }

        .db-stack {
            fill: #475569;
        }
        
        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .highlighted {
            stroke: var(--success-color) !important;
            stroke-width: 3 !important;
            filter: drop-shadow(0 0 10px var(--success-color)) !important;
        }
        
        .highlighted-text {
            fill: var(--success-color) !important;
        }

    </style>
</head>
<body>

    <header>
        <h1>RAG 檢索增強生成</h1>
        <div class="subtitle">Retrieval-Augmented Generation 流程可視化</div>
    </header>

    <div class="container">
        <svg id="ragSvg" viewBox="0 0 800 500">
            <!-- Definitions for markers and gradients -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
                </marker>
                <marker id="arrowhead-active" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
                </marker>
            </defs>

            <!-- Connections -->
            <!-- 1. User to Embedding -->
            <path id="path1" class="connection-path" d="M 100 250 L 250 250" marker-end="url(#arrowhead)"/>
            <!-- 2. Embedding to Vector DB -->
            <path id="path2" class="connection-path" d="M 350 250 L 450 150" marker-end="url(#arrowhead)"/>
            <!-- 3. Vector DB to Context -->
            <path id="path3" class="connection-path" d="M 550 150 L 600 220" marker-end="url(#arrowhead)"/>
            <!-- 4. User Query direct to Context (Conceptual merge) -->
            <path id="path4" class="connection-path" d="M 350 250 Q 400 300 580 280" marker-end="url(#arrowhead)"/>
            <!-- 5. Context to LLM -->
            <path id="path5" class="connection-path" d="M 650 250 L 650 350" marker-end="url(#arrowhead)"/>
            <!-- 6. LLM to User -->
            <path id="path6" class="connection-path" d="M 600 400 L 100 400 L 100 300" marker-end="url(#arrowhead)"/>

            <!-- Nodes -->
            
            <!-- User Node -->
            <g id="node-user" class="node-group" transform="translate(50, 200)">
                <rect width="100" height="100" class="node-rect" />
                <text x="50" y="85" class="node-text">使用者</text>
                <!-- User Icon -->
                <path class="node-icon" d="M50 30a15 15 0 1 0 0 30 15 15 0 0 0 0-30zm0 35c-18 0-30 10-30 20v5h60v-5c0-10-12-20-30-20z" transform="translate(-25, -15) scale(0.5)"/>
            </g>

            <!-- Embedding Model Node -->
            <g id="node-embed" class="node-group" transform="translate(250, 200)">
                <rect width="100" height="100" class="node-rect" />
                <text x="50" y="85" class="node-text">Embedding</text>
                <text x="50" y="30" class="node-text" style="font-size: 10px; fill: #94a3b8;">模型</text>
                <!-- Gear Icon -->
                <path class="node-icon" d="M50 25l3 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z" transform="translate(-25, -10) scale(0.8)"/> 
                <circle cx="50" cy="50" r="15" fill="none" stroke="#38bdf8" stroke-width="2"/>
                <circle cx="50" cy="50" r="5" fill="#38bdf8"/>
            </g>

            <!-- Vector DB Node -->
            <g id="node-db" class="node-group" transform="translate(450, 100)">
                <rect width="100" height="100" class="node-rect" />
                <text x="50" y="85" class="node-text">向量資料庫</text>
                <!-- DB Icon -->
                <ellipse cx="50" cy="30" rx="20" ry="8" class="db-stack" fill="#64748b"/>
                <path d="M30 30 v40 c0 5 20 5 40 0 v-40" fill="#475569" />
                <ellipse cx="50" cy="70" rx="20" ry="8" fill="#475569"/>
            </g>

            <!-- Context Node -->
            <g id="node-context" class="node-group" transform="translate(580, 200)">
                <rect width="120" height="80" class="node-rect" />
                <text x="60" y="45" class="node-text">Prompt 構建</text>
                <text x="60" y="65" class="node-text" style="font-size: 10px; fill: #94a3b8;">(查詢 + 檢索內容)</text>
            </g>

            <!-- LLM Node -->
            <g id="node-llm" class="node-group" transform="translate(600, 350)">
                <rect width="100" height="100" class="node-rect" />
                <text x="50" y="85" class="node-text">LLM</text>
                <!-- Brain/Chip Icon -->
                <rect x="30" y="30" width="40" height="40" rx="5" fill="none" stroke="#38bdf8" stroke-width="2"/>
                <path d="M35 35 h30 v30 h-30 z" fill="#38bdf8" opacity="0.3"/>
                <line x1="30" y1="40" x2="20" y2="40" stroke="#38bdf8" stroke-width="2"/>
                <line x1="30" y1="50" x2="20" y2="50" stroke="#38bdf8" stroke-width="2"/>
                <line x1="30" y1="60" x2="20" y2="60" stroke="#38bdf8" stroke-width="2"/>
                <line x1="70" y1="40" x2="80" y2="40" stroke="#38bdf8" stroke-width="2"/>
                <line x1="70" y1="50" x2="80" y2="50" stroke="#38bdf8" stroke-width="2"/>
                <line x1="70" y1="60" x2="80" y2="60" stroke="#38bdf8" stroke-width="2"/>
            </g>

            <!-- Moving Packets -->
            <circle id="packet" r="8" class="packet" cx="0" cy="0" />
            
            <!-- Text Label for Packet -->
            <text id="packet-label" x="0" y="-15" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" opacity="0">Query</text>

        </svg>
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startSimulation()">開始演示</button>
        <button class="reset" onclick="resetSimulation()">重置</button>
    </div>

    <div class="info-panel">
        <div id="stepTitle" class="info-title">準備就緒</div>
        <div id="stepDesc" class="info-desc">點擊「開始演示」按鈕來觀察 RAG 系統如何運作。</div>
    </div>

    <script>
        const steps = [
            {
                id: 1,
                title: "1. 使用者提問 (User Query)",
                desc: "使用者輸入問題，例如：「公司的請假政策是什麼？」。這個自然語言的查詢被發送到系統中。",
                path: "path1",
                startNode: "node-user",
                endNode: "node-embed",
                packetText: "Query"
            },
            {
                id: 2,
                title: "2. 向量化 (Embedding)",
                desc: "Embedding 模型將使用者的文字問題轉換成數值向量 (Vector)。這讓電腦能夠理解語意。",
                path: "path2",
                startNode: "node-embed",
                endNode: "node-db",
                packetText: "Vector"
            },
            {
                id: 3,
                title: "3. 語意檢索 (Retrieval)",
                desc: "系統在向量資料庫中搜尋與問題向量最相似的文檔片段。這就是「檢索」步驟。",
                path: "path3",
                startNode: "node-db",
                endNode: "node-context",
                packetText: "Docs"
            },
            {
                id: 4,
                title: "4. 構建 Prompt (Augmentation)",
                desc: "將原始問題與檢索到的相關文檔合併，形成一個包含豐富上下文的 Prompt。",
                path: "path4", // Visualizing the merge
                startNode: "node-embed", // Conceptually flow continues
                endNode: "node-context",
                packetText: "Context",
                special: true // Just for text update, animation handled differently
            },
            {
                id: 5,
                title: "5. 生成回答 (Generation)",
                desc: "將構建好的 Prompt 發送給 LLM (大型語言模型)。LLM 根據提供的上下文生成準確的回答。",
                path: "path5",
                startNode: "node-context",
                endNode: "node-llm",
                packetText: "Prompt"
            },
            {
                id: 6,
                title: "6. 返回結果 (Response)",
                desc: "LLM 生成的回答被傳送回使用者。因為有了檢索的資料，回答更精確且減少了幻覺。",
                path: "path6",
                startNode: "node-llm",
                endNode: "node-user",
                packetText: "Answer"
            }
        ];

        let currentStep = 0;
        let isRunning = false;
        const packet = document.getElementById('packet');
        const packetLabel = document.getElementById('packet-label');
        const titleEl = document.getElementById('stepTitle');
        const descEl = document.getElementById('stepDesc');
        const startBtn = document.getElementById('startBtn');

        function resetSimulation() {
            currentStep = 0;
            isRunning = false;
            packet.style.opacity = 0;
            packetLabel.style.opacity = 0;
            startBtn.disabled = false;
            startBtn.textContent = "開始演示";
            
            // Reset styles
            document.querySelectorAll('.node-rect').forEach(el => el.classList.remove('highlighted'));
            document.querySelectorAll('.connection-path').forEach(el => {
                el.classList.remove('active-path');
                el.setAttribute('marker-end', 'url(#arrowhead)');
            });
            
            titleEl.textContent = "準備就緒";
            descEl.textContent = "點擊「開始演示」按鈕來觀察 RAG 系統如何運作。";
        }

        async function startSimulation() {
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;
            startBtn.textContent = "演示中...";

            for (let i = 0; i < steps.length; i++) {
                await runStep(steps[i]);
                // Wait a bit between steps
                await new Promise(r => setTimeout(r, 1000));
            }

            isRunning = false;
            startBtn.disabled = false;
            startBtn.textContent = "再次演示";
            titleEl.textContent = "演示完成";
            descEl.textContent = "RAG 流程已完成。您可以再次點擊按鈕重新觀看。";
        }

        function runStep(step) {
            return new Promise(resolve => {
                // Update Info
                titleEl.textContent = step.title;
                descEl.textContent = step.desc;

                // Highlight Nodes
                document.querySelectorAll('.node-rect').forEach(el => el.classList.remove('highlighted'));
                const startNodeRect = document.querySelector(`#${step.startNode} .node-rect`);
                const endNodeRect = document.querySelector(`#${step.endNode} .node-rect`);
                
                if(startNodeRect) startNodeRect.classList.add('highlighted');

                // Highlight Path
                const path = document.getElementById(step.path);
                if (path) {
                    path.classList.add('active-path');
                    path.setAttribute('marker-end', 'url(#arrowhead-active)');
                }

                // Animate Packet
                if (step.path) {
                    packet.style.opacity = 1;
                    packetLabel.style.opacity = 1;
                    packetLabel.textContent = step.packetText;

                    const pathLength = path.getTotalLength();
                    const duration = 2000; // 2 seconds
                    const startTime = performance.now();

                    function animate(time) {
                        let fraction = (time - startTime) / duration;
                        if (fraction > 1) fraction = 1;

                        const point = path.getPointAtLength(fraction * pathLength);
                        packet.setAttribute('cx', point.x);
                        packet.setAttribute('cy', point.y);
                        packetLabel.setAttribute('x', point.x);
                        packetLabel.setAttribute('y', point.y - 15);

                        if (fraction < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            // Step Complete
                            if(endNodeRect) endNodeRect.classList.add('highlighted');
                            if(startNodeRect) startNodeRect.classList.remove('highlighted');
                            resolve();
                        }
                    }
                    requestAnimationFrame(animate);
                } else {
                    // Fallback for steps without path movement (if any)
                    setTimeout(resolve, 1500);
                }
            });
        }
    </script>
</body>
</html>
