server {
    listen 80;
    server_name ${EXAM_SYSTEM_HOST};

    # 隱藏 Nginx 版本號
    server_tokens off;

    # Nginx 在 Docker 內需使用此語法來處理變數導向的 Proxy
    resolver 127.0.0.11 valid=30s;

    # 1. 將 WebSocket/SockJS 端點轉發給 Backend (Spring Boot) 服務
    location ^~ /ws {
        set $backend ${BACKEND_URL};
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/SockJS 連線升級
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 2. 將 API 與 OAuth 轉發給 Backend (Spring Boot) 服務
    location ~* ^/(api|oauth2|login/oauth2)/ {
        set $backend ${BACKEND_URL};
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支援
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. 將所有首頁與畫面轉發給 Frontend (Caddy) 服務
    location / {
        # 由於 Zeabur 內部通信，使用變數動態轉發
        set $frontend ${FRONTEND_URL};
        proxy_pass $frontend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
