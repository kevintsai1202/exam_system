# Spring Boot 應用配置
spring:
  application:
    name: exam-system

  # Google OAuth2 配置
  security:
    oauth2:
      client:
        registration:
          google:
            # 使用空字串作為預設值，未設定時 Spring Security 自動跳過 Google OAuth2 註冊
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  # H2 資料庫配置
  datasource:
    url: jdbc:h2:file:./data/examdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # H2 控制台配置（開發用）
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # 批次處理配置（優化 N+1 查詢問題）
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  # Jackson 配置（JSON 序列化）
  jackson:
    time-zone: Asia/Taipei
    date-format: yyyy-MM-dd'T'HH:mm:ss
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # 郵件配置
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 伺服器配置
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 日誌配置
logging:
  level:
    root: INFO
    com.exam.system: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 應用自定義配置
exam:
  qrcode:
    width: 300
    height: 300
  websocket:
    allowed-origins:
      - "http://localhost:5173"  # 開發環境（前端開發伺服器）
      - "http://localhost:5174"  # 開發環境（前端開發伺服器 - 備用端口）
      - "http://localhost:3000"  # 開發環境（備用）
      - "http://localhost"       # 生產環境（整合部署 - 80 端口）
  access-code:
    length: 6
    characters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
  security:
    admin-token: "${ADMIN_TOKEN}"

# 應用程式 URL 與 JWT 配置
app:
  # 前端 URL（對應 SecurityConfig @Value、OAuth2 redirect）
  # Zeabur 部署時設定環境變數 APP_FRONTEND_URL=https://your-domain.zeabur.app
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  # JWT 密鑰（生產環境請務必透過 APP_JWT_SECRET 環境變數覆蓋預設值）
  jwt:
    secret: ${APP_JWT_SECRET:exam-system-default-jwt-secret-key-for-development-only-please-change-in-production}
    expiration: ${APP_JWT_EXPIRATION:86400000}