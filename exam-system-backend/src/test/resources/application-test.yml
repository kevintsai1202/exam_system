# 測試環境配置
spring:
  application:
    name: exam-system-test

  # H2 測試資料庫配置（記憶體模式）
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 控制台配置
  h2:
    console:
      enabled: false

  # 測試環境停用 Flyway：schema 由 hibernate ddl-auto: create-drop 全權管理
  flyway:
    enabled: false

  # 測試環境 OAuth2 佔位設定：
  #   application.yml 預設 client-id 為空字串，Spring Security 會因
  #   "client-id must not be empty" 而無法建立 ClientRegistrationRepository。
  #   提供測試用假值讓 SecurityConfig.securityFilterChain 可以正常初始化；
  #   測試不會實際觸發 OAuth2 流程。
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id-placeholder
            client-secret: test-google-client-secret-placeholder
            scope: email,profile

  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  # Jackson 配置
  jackson:
    time-zone: Asia/Taipei
    date-format: yyyy-MM-dd'T'HH:mm:ss
    default-property-inclusion: non_null

# 伺服器配置
server:
  port: 0  # 隨機端口

# 日誌配置
logging:
  level:
    root: WARN
    com.exam.system: INFO
    org.springframework: WARN
    org.hibernate: WARN

# 應用自定義配置
exam:
  qrcode:
    width: 300
    height: 300
  websocket:
    allowed-origins:
      - "*"
  access-code:
    length: 6
    characters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
